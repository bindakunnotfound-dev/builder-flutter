name: Build Flutter Cloud Builder APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-cloud-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Builder APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter project files
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml || { echo 'ERROR: pubspec.yaml tidak ditemukan di root repository.'; exit 1; }
          test -f lib/main.dart || { echo 'ERROR: lib/main.dart tidak ditemukan di root repository.'; exit 1; }
          test -f .github/workflows/build.yml || { echo 'ERROR: workflow file tidak ditemukan.'; exit 1; }
          echo 'Struktur proyek Flutter terdeteksi.'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Cloud-Builder-APKs
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14
