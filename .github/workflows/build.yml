name: Build Android APK

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify required Android service source exists
        run: |
          test -f android/app/src/main/java/com/nullx/evo/MainActivity.java
          test -f android/app/src/main/java/com/nullx/evo/MirrorService.java
          grep -q 'class MirrorService' android/app/src/main/java/com/nullx/evo/MirrorService.java

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: excellent-mirror-split-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: excellent-mirror-build-diagnostics
          path: |
            build/**/outputs/**
            android/.gradle/**/daemon/**
          if-no-files-found: ignore
